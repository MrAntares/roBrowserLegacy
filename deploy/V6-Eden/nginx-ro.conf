# Merge these locations into the HTTPS server block. Adjust `root` to the
# directory whose `ro/` child contains this deployment bundle.
location ~* ^/ro/.*\.(?:js|mjs)$ {
    root /var/www/lastro;
    try_files $uri =404;
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
}

location /ro/ {
    root /var/www/lastro;
    try_files $uri $uri/ =404;
}
