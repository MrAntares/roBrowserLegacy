<div id="WinLogin" class="win_login">
	<div class="wl-composition">
		<img
			class="wl-logo"
			src="/ragidle/login/logo-classic-idle.webp"
			alt="Ragnarok Classic Idle"
			width="1280"
			height="855"
			fetchpriority="high"
			draggable="false"
		/>
		<section class="wl-window ri-window" aria-labelledby="wl-title">
			<span class="wl-corner wl-corner--left" aria-hidden="true"></span>
			<span class="wl-corner wl-corner--right" aria-hidden="true"></span>
			<div class="wl-header">
				<button type="button" class="exit wl-close ri-close" title="Sair" aria-label="Sair">&times;</button>
				<p class="wl-eyebrow">Bem-vindo a Midgard</p>
				<h1 id="wl-title" class="wl-title">Sua aventura continua</h1>
				<div class="wl-ornament" aria-hidden="true"><span></span></div>
			</div>

			<div class="wl-body">
				<label class="wl-field">
					<span class="wl-label">Usuário</span>
					<!-- data-permitir-autofill: AQUI o preenchimento salvo e desejado;
				     o escudo do GUIComponent nao toca nestes dois campos. -->
					<input
						id="user"
						name="username"
						class="user ri-input"
						type="text"
						value=""
						autocomplete="username"
						autocapitalize="none"
						spellcheck="false"
						data-permitir-autofill
					/>
				</label>
				<label class="wl-field">
					<span class="wl-label">Senha</span>
					<input
						id="pass"
						class="pass ri-input"
						type="password"
						value=""
						autocomplete="current-password"
						data-permitir-autofill
					/>
				</label>

				<div class="wl-opcoes">
					<button id="save" class="save wl-save" type="button" aria-pressed="false">
						<span class="wl-save-box" aria-hidden="true"></span>
						<span class="wl-save-label">Lembrar usuário</span>
					</button>
					<button class="btn forgot wl-link wl-esqueci" type="button">Esqueci minha senha</button>
				</div>

				<button id="btn_connect" class="btn connect ri-btn" type="submit">
					<span>Entrar em Midgard</span><span class="wl-arrow" aria-hidden="true">&rarr;</span>
				</button>

				<!-- ENTRAR COM GOOGLE OU DISCORD (10/10/2026): nasce escondido e so
				     aparece com o provedor ligado no servidor (entradaSocial.js). -->
				<div class="wl-social" hidden>
					<p class="wl-social-ou" aria-hidden="true"><span>ou</span></p>
					<button class="btn wl-social-btn" data-social="google" type="button" hidden>
						<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
						<span>Entrar com Google</span>
					</button>
					<button class="btn wl-social-btn wl-social-btn--discord" data-social="discord" type="button" hidden>
						<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.32 4.37a19.8 19.8 0 0 0-4.89-1.52.07.07 0 0 0-.08.04c-.21.38-.44.86-.6 1.25a18.27 18.27 0 0 0-5.5 0 12.6 12.6 0 0 0-.61-1.25.08.08 0 0 0-.08-.04 19.7 19.7 0 0 0-4.89 1.52.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 6 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-1.99a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.89.08.08 0 0 1-.01-.13l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.06 0a.07.07 0 0 1 .08.01l.37.29a.08.08 0 0 1-.01.13c-.6.35-1.22.65-1.87.89a.08.08 0 0 0-.04.11c.36.7.77 1.36 1.22 1.99a.08.08 0 0 0 .09.03 19.8 19.8 0 0 0 6-3.03.08.08 0 0 0 .03-.05c.5-5.18-.84-9.68-3.55-13.66a.06.06 0 0 0-.03-.03zM8.02 15.33c-1.18 0-2.16-1.09-2.16-2.42s.96-2.42 2.16-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.96 2.42-2.16 2.42zm7.97 0c-1.18 0-2.15-1.09-2.15-2.42s.95-2.42 2.15-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.95 2.42-2.16 2.42z"/></svg>
						<span>Entrar com Discord</span>
					</button>
				</div>

				<div class="wl-links">
					<span>Primeira aventura?</span>
					<button class="btn signup wl-link" type="button">Criar conta</button>
				</div>
				<button class="btn replay wl-link wl-replay" type="button">Assistir a um replay</button>
				<input type="file" class="replay-upload" accept=".rrf" style="display: none" />
			</div>
		</section>
	</div>
</div>
