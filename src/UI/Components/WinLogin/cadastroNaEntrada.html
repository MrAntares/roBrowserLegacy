<!-- A JANELA DE CADASTRO DENTRO DA TELA DE LOGIN (23/09/2026). A mesma janela
     do site (`#pre-modal` em rag-idle-site/index.html), com os mesmos campos e
     o mesmo POST /cadastrar. Ver `cadastroNaEntrada.js`. -->
<div class="cad" hidden>
	<div class="cad-fundo" data-fechar-cad></div>

	<div class="cad-janela" role="dialog" aria-modal="true" aria-labelledby="cad-titulo">
		<div class="cad-barra">
			<span class="cad-gema" aria-hidden="true"></span>
			<h2 class="cad-barra-titulo" id="cad-titulo">Cadastre-se</h2>
			<button class="cad-fechar" type="button" data-fechar-cad aria-label="Fechar janela">
				<svg
					width="14"
					height="14"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2.4"
					stroke-linecap="round"
					aria-hidden="true"
				>
					<path d="M6 6 18 18M18 6 6 18" />
				</svg>
			</button>
		</div>

		<div class="cad-corpo">
			<img
				class="cad-logo"
				src="/ragidle/login/logo-classic-idle.webp"
				alt=""
				aria-hidden="true"
				width="1280"
				height="855"
				draggable="false"
			/>

			<p class="cad-chamada">Crie sua conta e comece a jogar</p>

			<form class="cad-form" novalidate>
				<div class="cad-campo">
					<label class="cad-rotulo" for="cad-nome">Nome</label>
					<div class="cad-caixa">
						<svg
							class="cad-icone"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
							<circle cx="12" cy="7" r="4" />
						</svg>
						<input
							class="cad-input"
							type="text"
							id="cad-nome"
							name="nome"
							autocomplete="name"
							maxlength="60"
							placeholder="Nome e sobrenome"
							data-permitir-autofill
						/>
					</div>
				</div>

				<div class="cad-campo">
					<label class="cad-rotulo" for="cad-telefone">Telefone</label>
					<div class="cad-caixa">
						<svg
							class="cad-icone"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path
								d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
							/>
						</svg>
						<input
							class="cad-input"
							type="tel"
							id="cad-telefone"
							name="telefone"
							autocomplete="tel"
							maxlength="24"
							placeholder="(11) 91234-5678"
							data-permitir-autofill
						/>
					</div>
				</div>

				<div class="cad-campo cad-inteira">
					<label class="cad-rotulo" for="cad-email">E-mail</label>
					<div class="cad-caixa">
						<svg
							class="cad-icone"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<rect width="20" height="16" x="2" y="4" rx="2" />
							<path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
						</svg>
						<input
							class="cad-input"
							type="email"
							id="cad-email"
							name="email"
							autocomplete="email"
							maxlength="120"
							placeholder="voce@exemplo.com"
							data-permitir-autofill
						/>
					</div>
				</div>

				<p class="cad-divisor cad-inteira" aria-hidden="true"><span>sua conta no jogo</span></p>

				<div class="cad-campo">
					<label class="cad-rotulo" for="cad-usuario">Usuário</label>
					<div class="cad-caixa">
						<svg
							class="cad-icone"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
							<circle cx="12" cy="7" r="4" />
						</svg>
						<input
							class="cad-input"
							type="text"
							id="cad-usuario"
							name="usuario"
							autocomplete="username"
							maxlength="23"
							spellcheck="false"
							autocapitalize="off"
							placeholder="4 a 23 caracteres"
							data-permitir-autofill
						/>
					</div>
					<span class="cad-dica">Letras, números e _ . É com ele que você entra no jogo.</span>
				</div>

				<div class="cad-campo">
					<label class="cad-rotulo" for="cad-senha">Senha</label>
					<div class="cad-caixa">
						<svg
							class="cad-icone"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
							<path d="M7 11V7a5 5 0 0 1 10 0v4" />
						</svg>
						<input
							class="cad-input cad-input--acao"
							type="password"
							id="cad-senha"
							name="senha"
							autocomplete="new-password"
							maxlength="23"
							placeholder="4 a 23 caracteres"
							data-permitir-autofill
						/>
						<button type="button" class="cad-olho" aria-label="Mostrar senha">
							<svg
								class="cad-olho-aberto"
								width="18"
								height="18"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
								<circle cx="12" cy="12" r="3" />
							</svg>
							<svg
								class="cad-olho-fechado"
								width="18"
								height="18"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path
									d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3 3.9M6.6 6.7A17.7 17.7 0 0 0 2 13s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1"
								/>
								<path d="m3 3 18 18" />
								<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
							</svg>
						</button>
					</div>
				</div>

				<fieldset class="cad-sexos cad-inteira">
					<legend class="cad-rotulo">Personagem</legend>
					<label><input type="radio" name="sexo" value="1" checked /><span>Masculino</span></label>
					<label><input type="radio" name="sexo" value="0" /><span>Feminino</span></label>
				</fieldset>

				<p class="cad-recado cad-inteira" role="status" hidden></p>

				<button class="cad-enviar cad-inteira" type="submit">Criar conta e jogar</button>

				<button class="cad-ja cad-inteira" type="button" data-fechar-cad>Já tenho conta</button>

				<p class="cad-nota cad-inteira">Seus dados ficam com a gente e não são compartilhados.</p>
			</form>
		</div>
	</div>
</div>
