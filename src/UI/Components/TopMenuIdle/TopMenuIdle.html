		<!-- RECOMPENSAS (06/09/2026, pedido do dono): TROCOU DE CASA com o
		     Missoes. Ate hoje ele era o ultimo item do leque e o Missoes era o
		     sexto do cluster; o dono pediu a troca. Os dois so mudaram de
		     lugar -- nenhuma janela, nenhum "data-action" e nenhum pacote
		     mudou, e a contagem das duas partes continua a mesma (8 no
		     cluster, 11 no leque).

		     Por que ele merece o cluster: e o unico produto PAGO do menu, e
		     um botao que se paga so existe se o jogador o encontrar. Numa
		     gaveta que vive FECHADA ele dependia de o jogador abrir a porta
		     por conta propria -- a mesma razao que ja tinha trazido o Correio
		     para ca (ver o bloco dele acima).

		     O "data-action" continua "passe", e a divergencia com o rotulo e
		     deliberada: ele nomeia o DOMINIO (o componente e PasseIdle, os
		     pacotes sao CZ/ZC_RAGIDLE_*_PASSE) e "Recompensas" e o nome que o
		     jogador ve. Alem disso e a chave que o switch de TopMenuIdle.js e
		     o gate prova-clique-nao-vaza.ts ja miram: renomear a cadeia
		     inteira seria churn nos dois repositorios para trocar uma palavra
		     de tela.

		     O DESTAQUE dourado (".tm-item--destaque") VEIO JUNTO, e continua
		     valendo aqui: a regra do CSS nunca foi escopada ao leque, e o
		     vocabulario (--border-gold/--glow-gold) e o da janela que ele
		     abre. O ICONE e ARTE REAL do cliente
		     (ro_menu_icon/achievement_1.bmp, o trofeu), pela regra 4.

		     ─── POR QUE ELE E O PRIMEIRO DA SEGUNDA FILEIRA, E NAO ONDE O
		     MISSOES ESTAVA ────────────────────────────────────────────────
		     Isto NAO e gosto: e a unica posicao que cabe. A grade tem colunas
		     "auto", entao a largura de cada coluna e a do ROTULO mais largo
		     dela, e "Recompensas" e o rotulo mais largo do cluster inteiro.
		     Em qualquer coluna que nao seja a do "Personagem" (o segundo mais
		     largo) ele SOMA largura ao cluster; embaixo dele, o "max" da
		     coluna quase nao muda.

		     Medido num arnes de leiaute (o cluster sozinho num Playwright, em
		     768x1024): 337px aqui, 359px no lugar onde o Missoes estava, 331px
		     antes da troca. A diferenca nao e estetica: com ele no lugar do
		     Missoes o `prove:hud-responsiva` REPROVOU em tablet-768x1024 com
		     "BasicInfoIdle x TopMenuIdle.tm-top (13x146px)" — o cluster montou
		     em cima do painel do personagem. Aqui ele passa.

		     QUEM REORDENAR ESTE CLUSTER RE-MEDE. A regra em uma linha: o
		     rotulo mais longo mora na mesma coluna do segundo mais longo.

		     ─── ESTE BOTAO VIROU "TEMPORADA" EM 21/09/2026 ─────────────────
		     Ordem do dono: "a janela de recompensas nao compensa mais a gente
		     ter ela; vai colocar ela ali na aba da temporada". O Passe Semanal
		     e o VIP moram na janela da Temporada (abas proprias), e a janela
		     PasseIdle ficou sem porta - o modulo continua vivo como dono do
		     pacote 0x0fe5 (ver o cabecalho dele).

		     A Temporada TOMOU O LUGAR em vez de o buraco ficar: o argumento
		     de 06/09 acima (o unico produto PAGO do menu nao pode morar numa
		     gaveta que vive fechada) vale igual para ela - e mais, porque
		     agora ela e onde TUDO que e pago mora (caixas, passe, VIP). Ela
		     saiu do leque, que fica com 10 itens. A posicao na grade e a
		     MESMA, e a medicao de largura acima continua valendo por
		     construcao: "Temporada" e mais CURTO que "Recompensas", entao a
		     coluna so pode encolher.

		     O ICONE e o bau ilustrado (`recompensas`, arte do dono) e nao o
		     eclipse Lucide do item do leque: os vizinhos do cluster sao todos
		     arte ilustrada, e um traco fino de 2px dentro do disco dourado
		     de destaque some. O bau tambem e o que a janela vende. -->
		<button type="button" class="tm-item tm-item--destaque" data-action="temporada" title="Temporada: caixas, passe e VIP">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:recompensas-->
				<!-- Ponto de "recompensa pronta para resgatar" (29/09/2026). -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Temporada</span>
		</button>

		<!-- Correio: a caixa do SISTEMA (rag-idle-master/servidor/caixa.ts,

			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:correio-->
				<!-- Ponto de "ha mensagem por ler" — receita ".ri-dot" do design
				     system, a MESMA que o ponto de skill acima usa. A fonte do
				     dado e CorreioIdle.temNaoLidas(), que conta o "Isread" da
				     lista do servidor e, enquanto ela nao chegou, cai no proprio

				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Correio</span>
		</button>

		<!-- O "Idle" (data-action="config", a janela IdleConfig) SAIU em
		     07/10/2026 com o Novo Bot V5: o "Bot" logo abaixo e quem ocupa o

		<!-- BOT (07/10/2026, pacote "Novo Bot V5"): o menu do Bot novo, que

			<span class="tm-label">Bot</span>
		</button>

		<!-- HUNT ANALYZER: a leitura da cacada em curso (exp/hora, abates/hora,

		     Icone "grafico": ja existia em ri-icones.js e nao tinha consumidor.

			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:grafico--></span>
			<span class="tm-label">Análise</span>
		</button>

		<!-- VOTAR (D-1159, 07/09/2026, pedido do dono: "esse botao de votar
		     deve ficar na barra de cima ao lado do mini mapa com bastante
		     destaque quando tem voto disponivel").

		     ─── ELE MUDOU DE LUGAR NA TELA EM 08/09/2026, E NAO NO DOM ──────
		     Pedido do dono, olhando o cluster no jogo: *"mude o icone de Votar
		     de lugar, coloque ele ao lado do icone Caca, sobrando uma vaga
		     para icone abaixo"*. Agora, em tela larga, ele desenha na PRIMEIRA
		     fileira, coluna 5, colado no "Caca" — e a coluna 5 da segunda
		     fileira fica vazia, que e a vaga que o dono reservou.

		     A mudanca e de GRADE, nao de documento: ele continua sendo o nono
		     `<button>` daqui, e quem o move e uma regra de uma linha no
		     TopMenuIdle.css (`.tm-top[data-colunas="5"] .tm-item--voto`). Isso
		     e deliberado, e custou uma medicao para descobrir: reordenar o DOM
		     (por o botao entre "Caca" e "Recompensas") tira o "Recompensas" da
		     coluna do "Personagem" e o poe na do "Mochila" — e a regra de D-944
		     diz que o rotulo mais longo tem de morar na coluna do segundo mais
		     longo. Medido: com o DOM reordenado, o `prove:hud-responsiva`
		     REPROVA em tablet-768x1024 mesmo com quatro colunas
		     ("BasicInfoIdle x TopMenuIdle.tm-top 13x224px"), porque o cluster
		     engorda 13px. Com o DOM intacto, a queda para quatro colunas volta
		     a ser BYTE A BYTE o arranjo que ja passava.

		     ─── POR QUE ELE E O NONO E ULTIMO NO DOM, E POR QUE ISSO NAO
		     ENGORDA O CLUSTER ──────────────────────────────────────────────
		     A regra medida em D-944 diz que a grade tem colunas "auto": a
		     largura de cada coluna e a do ROTULO mais largo dela. Um nono item
		     com a conta antiga de colunas (metade dos visiveis, arredondada
		     para cima) daria CINCO colunas, e a quinta nasceria com o
		     "Recompensas" sozinho — o rotulo mais largo do cluster inteiro
		     virando a coluna mais larga, ~84px a mais.

		     Com QUATRO colunas (o teto abaixo de 900px de largura, ver
		     distribuirFileiras() em TopMenuIdle.js) ele cai na TERCEIRA
		     fileira, na coluna 1, embaixo de "Personagem" e "Recompensas".
		     "Votar" e mais curto que os dois, entao o `max` da coluna nao muda
		     e a largura do cluster fica IDENTICA a de antes deste botao. O que
		     cresce e a altura, para baixo, onde ha espaco — e o rastreador de
		     missoes ja se ajusta sozinho por `--tm-topo` (D-930).

		     ACIMA de 900px o teto e CINCO, e ai ele sobe para a primeira
		     fileira (a regra de grade citada acima). A quinta coluna que nasce
		     e a do "Votar", um dos rotulos mais curtos — nao a do
		     "Recompensas", que era o risco medido em D-1159. O corte em 900px
		     tambem foi medido: com cinco colunas em TODA tela o cluster vai de
		     333px para 403px e o `prove:hud-responsiva` reprova em
		     tablet-768x1024 ("BasicInfoIdle x TopMenuIdle.tm-top 57x146px").

		     ─── O DESTAQUE ──────────────────────────────────────────────────
		     ".is-voto-livre" (aro dourado + pulso) entra e sai por JS, lendo
		     `VotoIdle.temVotoDisponivel()` — que le o campo `liberados` que o
		     SERVIDOR calculou. O botao e a janela contam a mesma historia
		     porque leem o mesmo numero; recalcular aqui seria a segunda conta
		     da mesma regra. -->
		<button type="button" class="tm-item tm-item--voto" data-action="voto" title="Votar e ganhar Vote Cash">
			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:voto-->
				<!-- Ponto de "ha voto disponivel" — a MESMA receita ".ri-dot" do
				     Correio e do Skills, para o aviso sobreviver ao cluster
				     recolhido (ele migra para a alca, ver syncToggleDot()). -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Votar</span>
		</button>

		<!-- RO SHOP NO CLUSTER (24/09/2026, pedido do dono: "o RO Shop fica
		     no menu, que so aparece com o Menu aberto, e os jogadores nao o
		     acham - coloque-o sempre visivel, abaixo do Votar").

		     Ele ocupa a VAGA que o dono reservou em 08/09 ao mover o "Votar"
		     (coluna 5 da segunda fileira, ao lado do "Analise"): e o DECIMO
		     `<button>` e quem o poe la e uma regra de grade de uma linha
		     (TopMenuIdle.css, `.tm-item--roshop`), pelo mesmo motivo do Votar -
		     reordenar o DOM mudaria as colunas do arranjo de quatro.

		     O item do LEQUE continua (mais abaixo): e a mesma porta, o mesmo
		     icone, o mesmo `data-action` e o mesmo `RoShop.toggle()`; os dois
		     handlers sao ligados botao a botao em `TopMenuIdle.init`, entao a
		     duplicata nao confunde o clique nem o aro de "janela aberta".

		     No celular em pe ele entra no TRILHO, no quinto degrau, abaixo do
		     "Config." (TopMenuIdle.css, bloco `.ri-vertical`): o trilho e o
		     que fica na tela com o menu fechado. -->
		<button type="button" class="tm-item tm-item--roshop" data-action="roshop" title="RO Shop">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:roshop--></span>
			<span class="tm-label">RO Shop</span>
		</button>

		<!-- Alca de recolher o CLUSTER (os 5 acima). Fica FORA do que ela
		     esconde, de proposito: nunca some, senao o jogador se tranca fora
		     dos essenciais. Recolhido, e o unico pixel que sobra deste canto.
		     O ".ri-dot" aqui e o do Correio/Skills EMPRESTADO: com o cluster
		     recolhido, o aviso passa a morar na alca (ver syncToggleDot()). -->
		<button type="button" class="tm-toggle" title="Recolher menu" aria-label="Recolher menu" aria-expanded="true" aria-controls="tm-top">
			<span class="tm-toggle-wrap ri-disc">
				<!--RI_ICONE:seta-->
				<span class="ri-dot" style="display: none"></span>
			</span>
		</button>
	</div>

	<!-- ═══ PARTE 2 — CANTO INFERIOR DIREITO: uma PORTA, nao um segundo
	     cluster (gabarito secao 2: "fechado, existe so o botao"). Um botao
	     "Menu"; clicando, o leque abre EM PE a partir dele; clicando de novo,
	     o leque some inteiro do DOM renderizado (display:none — ver
	     TopMenuIdle.js:aplicarEstadoDoLeque()) e sobra so o botao.

	     RODADA 2 (20/08/2026) — a forma MUDOU por pedido do dono, e a secao 3
	     do gabarito foi reescrita com ela: eram onze discos numa fileira
	     horizontal SEM rotulo, e sobre o calcamento claro de Prontera aquilo
	     lia como ruido. Agora sao DUAS COLUNAS em pe, com a carga dividida ao
	     meio, uma LINHA DOURADA vertical entre elas e um ornamento premium no
	     topo dessa linha. Em pe sobra largura, entao o ROTULO VOLTOU,
	     permanente e igual ao do cluster de cima — que era o defeito de
	     fundo.

	     ORDEM: funcionais primeiro (Guilda, Amigos, Grupo, Admin, Codex,
	     Missoes) e "em breve" por ultimo, nunca misturado. Em 06/09/2026 o
	     Recompensas SAIU daqui (subiu para o cluster) e o Missoes ENTROU no
	     lugar dele, no fim do bloco funcional -- a troca que o dono pediu; a
	     contagem do leque nao mudou (11 botoes, 10 visiveis). A leitura e a natural do
	     portugues: desce a coluna da ESQUERDA e depois desce a da DIREITA.
	     Quem POE cada item na sua coluna e o JS (distribuirColunas()), nao
	     este HTML: o item de Admin so existe para a conta dona, e com ele
	     escondido sobram 10 — que e o "5 de um lado e 5 do outro" do pedido.
	     O que este arquivo declara e a ORDEM canonica (coluna A e depois
	     coluna B, de cima para baixo); o corte entre as duas e recalculado a
	     cada aparicao. -->
	<div class="tm-menu">
		<div class="tm-fan" id="tm-fan" role="group" aria-label="Mais opções">
			<!-- O VEU (pedido do dono, 20/08/2026): "um gradiente preto saindo
			     da barra e indo ate as bordas com um efeito bem leve e suave de
			     escurecimento". E o CHAO do leque: sem ele os discos dependem do
			     que a cena tem atras, e o calcamento branco de Prontera briga
			     com eles.
			     Vem PRIMEIRO no HTML de proposito: assim ele pinta por baixo de
			     todos os discos sem precisar de z-index negativo (que sairia do
			     contexto de empilhamento do componente).
			     E ele NAO amplia area clicavel nenhuma: e "position:absolute"
			     (fora do fluxo da grade, entao nao mede nada) e
			     "pointer-events:none" (herdado do ".tm-fan" e repetido no CSS
			     por seguranca). Camada invisivel que cobre o mundo e a familia
			     de defeito que o gate de clique existe pra pegar -- ver o
			     cabecalho do CSS. -->
			<div class="tm-veu" aria-hidden="true"></div>

			<div class="tm-col tm-col--a">
				<!-- "Configuracoes" (20/08/2026) = a FUSAO dos dois icones que
				     existiam ate ontem, "Config" e "Menu". Os dois eram gaveta de
				     ajuste e o jogador tinha de adivinhar qual era qual. O clique
				     abre a "Configuracao idle" (IdleConfig), que e a janela que o
				     rotulo nomeia e a que se usa jogando. A janela de sistema do
				     ESC (audio/video/atalho/trocar personagem/fechar jogo)
				     continua na tecla ESC, nativa e intocada -- esta e a perda
				     declarada da fusao, registrada na resposta como pendencia
				     [DONO]. -->
				<button type="button" class="tm-item" data-action="guild" title="Guilda">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:guilda--></span>
					<span class="tm-label">Guilda</span>
				</button>

				<!-- AMIGOS (05/10/2026, sugestao de jogador): a lista online/offline,
				     com "Mensagem" e "Convidar" nos online. Logo depois da Guilda,
				     a ordem que o cabecalho do leque ja escrevia (Guilda, Amigos,

				<button type="button" class="tm-item" data-action="amigos" title="Amigos">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:amigos--></span>
					<span class="tm-label">Amigos</span>
				</button>

				<!-- OS DOIS CAMINHOS DE GRUPO, cada um com o proprio botao (D-988,
				     09/09/2026, pedido do dono).

				<button type="button" class="tm-item" data-action="group" title="Grupo">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:grupo--></span>

				<button type="button" class="tm-item tm-item-admin" data-action="admin" title="Admin">

				<!-- CODEX (29/08/2026, D-851): o bestiario que vira ponto de
				     atributo. Matar N de uma especie cumpre uma missao, e cada
				     missao cumprida vale 1 ponto para gastar num dos sete eixos.
				
				     LEQUE e nao cluster, pelo criterio que ja moveu o Idle e o
				     Analyzer para cima: o cluster e para o que se consulta DURANTE
