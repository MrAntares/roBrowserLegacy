name: "Build roBrowserLegacy"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    name: "Build and validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run Benchmarks
        run: |
          set -o pipefail
          npm run bench 2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee /tmp/bench.txt

      - name: Bench no Job Summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const input = '/tmp/bench.txt';
          if (!fs.existsSync(input)) {
            process.exit(0);
          }

          const groups = new Map();
          let currentTest = 'Benchmark';

          const addRow = (testName, row) => {
            if (!groups.has(testName)) groups.set(testName, []);
            groups.get(testName).push(row);
          };

          const lines = fs.readFileSync(input, 'utf8').split(/\r?\n/);

          for (const raw of lines) {
            const line = raw.trim();
            if (!line) continue;

            if (/^[✓√]\s+/.test(line)) {
              currentTest = line.replace(/^[✓√]\s+/, '').trim() || currentTest;
              continue;
            }

            // ignora linhas que não são benchmark
            if (line.startsWith('Benchmark') || line.startsWith('###') || line.startsWith('|') || line.startsWith('**')) {
              continue;
            }

            // aceita linhas no formato:
            // · JS 12,008.44 0.0620 4.8939 0.0833 ...
            // ou
            // JS 12,008.44 0.0620 4.8939 0.0833 ...
            const tokens = line.split(/\s+/);

            let bench = null;
            let vals = [];

            if (tokens[0] === '·' && tokens.length >= 10) {
              bench = tokens[1];
              vals = tokens.slice(2);
            } else if (tokens.length >= 9) {
              bench = tokens[0];
              vals = tokens.slice(1);
            }

            if (bench && vals.length >= 8) {
              const [hz, min, max, mean, p75, p99, rme, samples] = vals;

              addRow(currentTest, {
                bench,
                hz,
                min,
                max,
                mean,
                p75,
                p99,
                rme,
                samples
              });

              continue;
            }

            // comparação do tipo: 1.42x faster than JS
            const faster = line.match(/^([0-9]+(?:\.[0-9]+)?)x\s+(faster|slower)\s+than\s+(.+)$/i);
            if (faster) {
              const [, value, direction, target] = faster;
              const rows = groups.get(currentTest) || [];
              if (rows.length > 0) {
                rows[rows.length - 1].speed = `${value}x ${direction} than ${target}`;
              }
            }
          }

          const summary = ['## Benchmark', ''];

          if (groups.size === 0) {
            summary.push('No benchmark rows were parsed from the logs.');
            summary.push('```text');
            summary.push(fs.readFileSync(input, 'utf8').trim());
            summary.push('```');
          } else {
            for (const [testName, rows] of groups.entries()) {
              summary.push(`### ${testName}`);
              summary.push('');
              summary.push('| Bench | hz | min (ms) | max (ms) | mean (ms) | p75 | p99 | rme | samples |');
              summary.push('|---|---:|---:|---:|---:|---:|---:|---:|---:|');

              for (const row of rows) {
                summary.push(
                  `| ${row.bench} | ${row.hz} | ${row.min} | ${row.max} | ${row.mean} | ${row.p75} | ${row.p99} | ${row.rme} | ${row.samples} |`
                );
              }

              const speed = rows.find(r => r.speed)?.speed;
              if (speed) {
                summary.push('');
                summary.push(`**${speed}**`);
              }

              summary.push('');
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          NODE

      - name: Build project
        run: npm run build

      - name: Validate dist/Web
        run: test -d dist/Web
