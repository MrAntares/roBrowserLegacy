name: "Build roBrowserLegacy"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    name: "Build and validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run Benchmarks
        run: |
          set -o pipefail
          npm run bench 2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee /tmp/bench.txt

      - name: Bench no Job Summary
        if: always()
        run: |
          {  
            echo '## Benchmark'  
            echo  
            echo '| Test | Bench | hz | min (ms) | max (ms) | mean (ms) | p75 | p99 | rme | samples | Result |'  
            echo '|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---|'  
            awk '  
              function flush() {  
                for (i = 1; i <= nr; i++) {  
                  print rows[i] (i == nr && comp != "" ? " **" comp "** |" : " |")  
                }  
                nr = 0; comp = ""  
              }  
              # linhas de resultado comecam com "·"  
              $1 == "·" {  
                rows[++nr] = sprintf("| %s | %s | %s | %s | %s | %s | %s | %s | %s | %s |",  
                  group, $2, $3, $4, $5, $6, $7, $8, $11, $12)  
                next  
              }  
              # header de colunas do vitest  
              $1 == "name" { next }  
              # linha "X is Nx faster/slower than Y"  
              ($0 ~ /faster/ || $0 ~ /slower/) && $0 ~ /than/ {  
                comp = $0  
                sub(/^[[:space:]]+/, "", comp)  
                next  
              }  
              # ruido do runner (RUN, Duration, resumo, checkmark de arquivo)  
              /^[[:space:]]*$/ { next }  
              $1 ~ /^(RUN|Duration|Started|Ended|Commands|Arrived|Deps|Processed|Collected|Waiting|Running|Passing|Failing|Pending|Skipped|Ran|Test)/ { next }  
              $0 ~ /\.bench\.js/ { next }  
              # qualquer outra linha com texto e cabecalho de grupo (describe/suite)  
              {  
                line = $0  
                sub(/^[[:space:]✓✗×]+/, "", line)  
                sub(/[[:space:]]*\([0-9]+[^)]*\)[[:space:]]*[0-9,.]*ms?[[:space:]]*$/, "", line)  
                if (line != "") {  
                  flush()  
                  group = line  
                }  
              }  
              END { flush() }  
            ' /tmp/bench.txt  
            echo  
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build project
        run: npm run build

      - name: Validate dist/Web
        run: test -d dist/Web
