name: "Build roBrowserLegacy"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    name: "Build and validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run Benchmarks
        run: |
          set -o pipefail
          npm run bench 2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee /tmp/bench.txt

      - name: Benchmark summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const input = '/tmp/bench.txt';

          if (!fs.existsSync(input)) {
            process.exit(0);
          }

          const groups = new Map();
          let currentTest = 'Benchmark';

          function addBenchmark(testName, bench) {
            if (!groups.has(testName)) {
              groups.set(testName, []);
            }
            groups.get(testName).push(bench);
          }

          for (const rawLine of fs.readFileSync(input, 'utf8').split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line) continue;

            if (/^[✓√]\s+/.test(line)) {
              currentTest = line.replace(/^[✓√]\s+/, '').trim() || currentTest;
              continue;
            }

            const benchMatch = line.match(
              /^·\s+(\S+)\s+([0-9][0-9,]*(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([^\s]+)\s+([0-9]+)\s*$/
            );

            if (benchMatch) {
              const [, bench, hz, min, max, mean, p75, p99, rme, samples] = benchMatch;
              addBenchmark(currentTest, {
                bench,
                hz,
                min,
                max,
                mean,
                p75,
                p99,
                rme,
                samples
              });
              continue;
            }

            const fasterMatch = line.match(/^([0-9]+(?:\.[0-9]+)?)x\s+(faster|slower)\s+than\s+(.+)$/i);
            if (fasterMatch) {
              const [, value, direction, target] = fasterMatch;
              const rows = groups.get(currentTest) || [];
              if (rows.length) {
                rows[rows.length - 1].speed = `${value}x ${direction} than ${target}`;
              }
            }
          }

          const summary = ['## Benchmark', ''];

          if (groups.size === 0) {
            summary.push('No benchmark rows were parsed from the logs.');
            summary.push('```text');
            summary.push(fs.readFileSync(input, 'utf8').trim());
            summary.push('```');
          } else {
            for (const [testName, rows] of groups.entries()) {
              summary.push(`### ${testName}`);
              summary.push('');
              summary.push('| Bench | hz | min (ms) | max (ms) | mean (ms) | p75 | p99 | rme | samples |');
              summary.push('|---|---:|---:|---:|---:|---:|---:|---:|---:|');

              for (const row of rows) {
                summary.push(
                  `| ${row.bench} | ${row.hz} | ${row.min} | ${row.max} | ${row.mean} | ${row.p75} | ${row.p99} | ${row.rme} | ${row.samples} |`
                );
              }

              const speedText = rows.find(row => row.speed)?.speed;
              if (speedText) {
                summary.push('');
                summary.push(`**${speedText}**`);
              }

              summary.push('');
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          NODE

      - name: Build project
        run: npm run build

      - name: Validate dist/Web
        run: test -d dist/Web
