name: "Build roBrowserLegacy"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    name: "Build and validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run Benchmarks
        run: |
          set -o pipefail
          npm run bench 2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee /tmp/bench.txt

      - name: Bench no Job Summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const input = '/tmp/bench.txt';
          if (!fs.existsSync(input)) {
            process.exit(0);
          }

          const order = [];
          const groups = new Map();

          const ensureGroup = (testName) => {
            if (!groups.has(testName)) {
              groups.set(testName, { rows: [], speed: null });
              order.push(testName);
            }
            return groups.get(testName);
          };

          const lines = fs.readFileSync(input, 'utf8').split(/\r?\n/);

          for (const raw of lines) {
            const line = raw.trim();
            if (!line) continue;

            // Ex: ✓ tests/bench/paletteConvert.bench.js > palette convert 256x256 11131ms
            if (/^[✓√]\s+/.test(line)) {
              const testName = line.replace(/^[✓√]\s+/, '').trim();
              ensureGroup(testName);
              continue;
            }

            // Ex: · JS 7,736.53 0.0895 4.4356 ...
            const benchMatch = line.match(
              /^·\s+(\S+)\s+([0-9][0-9,]*(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([0-9]+(?:\.[0-9]+)?)\s+([^\s]+)\s+([0-9]+)\s*$/
            );

            if (benchMatch) {
              const [, bench, hz, min, max, mean, p75, p99, rme, samples] = benchMatch;
              const group = ensureGroup(currentTestName);
              group.rows.push({
                bench,
                hz,
                min,
                max,
                mean,
                p75,
                p99,
                rme,
                samples
              });
              continue;
            }

            // Ex: WASM - tests/bench/paletteConvert.bench.js > palette convert 256x256
            //     1.37x faster than JS
            const speedMatch = line.match(/^WASM\s*-\s*(.+)$/i);
            if (speedMatch) {
              const name = speedMatch[1].trim();
              const group = ensureGroup(name);
              continue;
            }

            const fasterMatch = line.match(/^([0-9]+(?:\.[0-9]+)?)x\s+(faster|slower)\s+than\s+(.+)$/i);
            if (fasterMatch) {
              const [, value, direction, target] = fasterMatch;
              const lastTest = order[order.length - 1];
              if (lastTest) {
                groups.get(lastTest).speed = `${value}x ${direction} than ${target}`;
              }
            }
          }

          const summary = ['## Benchmark', ''];

          for (const testName of order) {
            const group = groups.get(testName);
            if (!group || !group.rows.length) continue;

            summary.push(`### ${testName}`);
            summary.push('');
            summary.push('| Bench | hz | min (ms) | max (ms) | mean (ms) | p75 | p99 | rme | samples |');
            summary.push('|---|---:|---:|---:|---:|---:|---:|---:|---:|');

            for (const row of group.rows) {
              summary.push(
                `| ${row.bench} | ${row.hz} | ${row.min} | ${row.max} | ${row.mean} | ${row.p75} | ${row.p99} | ${row.rme} | ${row.samples} |`
              );
            }

            if (group.speed) {
              summary.push('');
              summary.push(`**${group.speed}**`);
            }

            summary.push('');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          NODE

      - name: Build project
        run: npm run build

      - name: Validate dist/Web
        run: test -d dist/Web
