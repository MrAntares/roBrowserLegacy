name: "Build roBrowserLegacy"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    name: "Build and validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run Benchmarks
        run: |
          set -o pipefail
          npm run bench 2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee /tmp/bench.txt

      - name: Bench no Job Summary
        if: always()
        run: |
          {
            echo '## Benchmark'
            echo
            echo '| Bench | hz | min (ms) | max (ms) | mean (ms) | p75 | p99 | rme | samples |'
            echo '|---|---:|---:|---:|---:|---:|---:|---:|---:|'
            awk '$1 == "·" { printf "| %s | %s | %s | %s | %s | %s | %s | %s | %s |\n", $2, $3, $4, $5, $6, $7, $8, $11, $12 }' /tmp/bench.txt
            echo
            grep -E 'faster|slower' /tmp/bench.txt | sed 's/^ *//' | sed 's/^/**/; s/$/**/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build project
        run: npm run build

      - name: Validate dist/Web
        run: test -d dist/Web
