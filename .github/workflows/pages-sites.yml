name: Deploy server sites to GitHub Pages

# After "Deploy to GitHub Pages" published a branch to gh-pages/<safe-branch>/, assembles every client
# build of .github/pages-sites/BUILDS into gh-pages/<folder>/<site>/, for every folder of
# .github/pages-sites/ but shared/ (cyro.live/…): the build's gh-pages folder, its branch's plugins/,
# shared/ (relay service worker, gate, landing page) and the site's own files (Config.local.js) on top.
# A keyed build gets its Online.js locked by encrypt.mjs (secret NPM_ACCESS_KEYS).
# workflow_run reads this file from the default branch: nothing is added to the source branches.
# `upstream` is in the trigger because pages.yml of that branch (upstream's, never edited) clears
# gh-pages/upstream/, where the upstream build's sites live: this run puts them back.

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [feat/native-plugin-manager, upstream-relay, cyro-prod, upstream]
  # A change to the sites themselves redeploys them from the current builds.
  push:
    branches: [master]
    paths: ['.github/pages-sites/**', '.github/workflows/pages-sites.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-pages-sites
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (pages-sites)
        uses: actions/checkout@v5
        with:
          path: repo
          sparse-checkout: .github/pages-sites

      - name: Test the page scripts
        run: node --test repo/.github/pages-sites/access-key.test.mjs repo/.github/pages-sites/relay-frame.test.mjs

      - name: Plugins of every source branch
        run: |
          set -euo pipefail
          mkdir plugins
          grep -v '^#' repo/.github/pages-sites/BUILDS | awk 'NF { print $2 }' | sort -u | while read -r branch; do
            safe="$(printf '%s' "$branch" | tr '/' '-' | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
            mkdir "plugins/$safe"
            git -C repo fetch --quiet --depth 1 origin "$branch"
            # upstream's tree has no plugins/
            if git -C repo cat-file -e FETCH_HEAD:plugins 2>/dev/null; then
              git -C repo archive FETCH_HEAD plugins | tar -x --strip-components=1 -C "plugins/$safe"
            fi
          done

      - name: Clone gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ghpages

      - name: Commit and push (retry, no rebase)
        env:
          NPM_ACCESS_KEYS: ${{ secrets.NPM_ACCESS_KEYS }}
        run: |
          set -euo pipefail
          SITES_DIR="$PWD/repo/.github/pages-sites"
          PLUGINS_DIR="$PWD/plugins"

          cd ghpages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            DEPLOYED="$(bash "$SITES_DIR/build-sites.sh" "$PLUGINS_DIR")"

            git add -A
            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Deploy${DEPLOYED}"

            if git push origin gh-pages; then
              exit 0
            fi

            sleep $((i * 2))
          done

          exit 1
